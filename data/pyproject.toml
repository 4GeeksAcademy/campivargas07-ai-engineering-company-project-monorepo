[project]
name = "brasaland-knowledge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "qdrant-client>=1.16,<1.17"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["data", "data.process", "data.pipelines", "data.eval"]
package-dir = {data = "."}
