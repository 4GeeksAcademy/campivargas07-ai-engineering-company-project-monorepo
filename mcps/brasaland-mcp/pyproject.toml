[project]
name = "brasaland-mcp"
version = "0.1.0"
description = "Brasaland MCP server: OAuth 2.1-protected tools over the real incidents and inventory APIs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # MCP Python SDK v1 line: FastMCP + Streamable HTTP. v2 renames FastMCP and is
    # not yet supported by mcpauth samples nor langchain-mcp-adapters (mcp<2).
    "mcp>=1.24,<2",
    # MCP Auth (https://mcp-auth.dev) resource-server mode: RFC 9728 Protected
    # Resource Metadata + JWT bearer verification (signature, issuer, audience,
    # expiry, scopes). Pinned: pre-release line that ships the resource-server API.
    "mcpauth==0.2.0b1",
    "httpx>=0.27,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.30",
]

[project.scripts]
brasaland-mcp = "brasaland_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brasaland_mcp"]
