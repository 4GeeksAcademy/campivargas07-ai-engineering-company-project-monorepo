[project]
name = "brasaland-incidents-api"
version = "0.1.0"
description = "FastAPI service for Brasaland incident analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4.0,<5.0",
  "fastapi>=0.116,<1.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.20,<1.0",
  "tinydb>=4.8,<5.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"