[project]
name = "brasaland-incidents-api"
version = "0.4.0"
description = "FastAPI service for Brasaland incident analysis and backoffice operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn>=0.35,<1.0",
  "tinydb>=4.8,<5.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "bcrypt>=4.1,<5.0",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"