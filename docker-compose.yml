services:
  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required. Configure a valid accessible PostgreSQL connection URL in .env}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required. Set a secure secret key in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - SUPPLIERS_DB_PATH=${SUPPLIERS_DB_PATH:-/app/api/data/suppliers.json}
      - PYTHONPATH=/app/api:/monorepo
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - EMBEDDING_API_BASE_URL=${EMBEDDING_API_BASE_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_TIMEOUT_SECONDS=${EMBEDDING_TIMEOUT_SECONDS:-30}
      - GENERATION_API_BASE_URL=${GENERATION_API_BASE_URL:-}
      - GENERATION_MODEL=${GENERATION_MODEL:-}
      - GENERATION_API_KEY=${GENERATION_API_KEY:-}
      - GENERATION_TIMEOUT_SECONDS=${GENERATION_TIMEOUT_SECONDS:-45}
      - GENERATION_TEMPERATURE=${GENERATION_TEMPERATURE:-0}
      - GENERATION_MAX_TOKENS=${GENERATION_MAX_TOKENS:-500}
      - KNOWLEDGE_MIN_SCORE=${KNOWLEDGE_MIN_SCORE:-}
    volumes:
      - ./services:/app
      - ./data:/monorepo/data:ro
      - ./docs/company-knowledge-base:/monorepo/docs/company-knowledge-base:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - brasaland-dev

  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
    container_name: brasaland-interfaces
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - INTERNAL_API_URL=http://backend:8000
      - WATCHPACK_POLLING=true
    volumes:
      - ./uis:/app/uis
      - ./src:/app/src:ro
      - /app/uis/website/node_modules
      - /app/uis/backoffice/node_modules
      - /app/uis/website/.next
      - /app/uis/backoffice/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - brasaland-dev

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: brasaland-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - brasaland-dev

networks:
  brasaland-dev:
    name: brasaland-dev
    driver: bridge

volumes:
  qdrant_storage: