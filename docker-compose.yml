services:
  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required. Configure a valid accessible PostgreSQL connection URL in .env}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required. Set a secure secret key in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - RAG_HTTP_CONTRACT=${RAG_HTTP_CONTRACT:-}
      - RAG_EMBEDDING_URL=${RAG_EMBEDDING_URL:-}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-}
      - RAG_EMBEDDING_API_KEY=${RAG_EMBEDDING_API_KEY:-}
      - RAG_EMBEDDING_DIMENSION=${RAG_EMBEDDING_DIMENSION:-}
      - RAG_EMBEDDING_ENCODING=${RAG_EMBEDDING_ENCODING:-}
      - RAG_GENERATION_URL=${RAG_GENERATION_URL:-}
      - RAG_GENERATION_MODEL=${RAG_GENERATION_MODEL:-}
      - RAG_GENERATION_API_KEY=${RAG_GENERATION_API_KEY:-}
      - RAG_MIN_SCORE=${RAG_MIN_SCORE:-}
      - RAG_TIMEOUT_SECONDS=${RAG_TIMEOUT_SECONDS:-30}
      - SUPPLIERS_DB_PATH=${SUPPLIERS_DB_PATH:-/app/api/data/suppliers.json}
    volumes:
      - ./services:/app
      - ./data:/data:ro
      - ./docs/company-knowledge-base:/docs/company-knowledge-base:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - brasaland-dev

  qdrant:
    image: qdrant/qdrant:v1.16.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - brasaland-knowledge-storage:/qdrant/storage
    networks:
      - brasaland-dev

  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
    container_name: brasaland-interfaces
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - INTERNAL_API_URL=http://backend:8000
      - WATCHPACK_POLLING=true
    volumes:
      - ./uis:/app/uis
      - ./src:/app/src:ro
      - /app/uis/website/node_modules
      - /app/uis/backoffice/node_modules
      - /app/uis/website/.next
      - /app/uis/backoffice/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - brasaland-dev

networks:
  brasaland-dev:
    name: brasaland-dev
    driver: bridge

volumes:
  brasaland-knowledge-storage:
